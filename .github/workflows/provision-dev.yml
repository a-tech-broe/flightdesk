name: Provision & Deploy (dev)

on:
  push:
    branches: [dev]

jobs:
  provision:
    name: Terraform — EC2
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        working-directory: infrastructure/terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"

      - name: Import existing resources (if not in state)
        working-directory: infrastructure/terraform
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_key_pair_name: ${{ secrets.EC2_KEY_PAIR_NAME }}
        run: |
          in_state() { terraform state list 2>/dev/null | grep -qx "$1"; }

          import_if_missing() {
            local addr=$1 id=$2
            if in_state "$addr"; then
              echo "SKIP: $addr (already in state)"
            else
              echo "IMPORT: $addr => $id"
              terraform import "$addr" "$id"
            fi
          }

          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=isDefault,Values=true" \
            --query 'Vpcs[0].VpcId' --output text)
          echo "Default VPC: $VPC_ID"

          SG_ID=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=flightdesk-dev" "Name=vpc-id,Values=$VPC_ID" \
            --query 'SecurityGroups[0].GroupId' --output text)
          echo "EC2 SG: $SG_ID"
          [[ "$SG_ID" =~ ^sg- ]] && import_if_missing aws_security_group.flightdesk_dev "$SG_ID"

          ALB_SG_ID=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=flightdesk-alb-dev" "Name=vpc-id,Values=$VPC_ID" \
            --query 'SecurityGroups[0].GroupId' --output text)
          echo "ALB SG: $ALB_SG_ID"
          [[ "$ALB_SG_ID" =~ ^sg- ]] && import_if_missing aws_security_group.alb "$ALB_SG_ID"

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=flightdesk-dev" \
                      "Name=instance-state-name,Values=running,stopped,pending" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          echo "Instance: $INSTANCE_ID"
          [[ "$INSTANCE_ID" =~ ^i- ]] && import_if_missing aws_instance.flightdesk_dev "$INSTANCE_ID"

          ALB_ARN=$(aws elbv2 describe-load-balancers \
            --names flightdesk-dev \
            --query 'LoadBalancers[0].LoadBalancerArn' --output text 2>/dev/null || echo "")
          echo "ALB: $ALB_ARN"
          [[ "$ALB_ARN" =~ ^arn: ]] && import_if_missing aws_lb.flightdesk "$ALB_ARN"

          TG_ARN=$(aws elbv2 describe-target-groups \
            --names flightdesk-dev \
            --query 'TargetGroups[0].TargetGroupArn' --output text 2>/dev/null || echo "")
          echo "TG: $TG_ARN"
          [[ "$TG_ARN" =~ ^arn: ]] && import_if_missing aws_lb_target_group.flightdesk "$TG_ARN"

      - name: Terraform Plan
        working-directory: infrastructure/terraform
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_key_pair_name: ${{ secrets.EC2_KEY_PAIR_NAME }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: infrastructure/terraform
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_key_pair_name: ${{ secrets.EC2_KEY_PAIR_NAME }}
        run: terraform apply -auto-approve tfplan

      - name: Associate EIP with instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=flightdesk-dev" \
                      "Name=instance-state-name,Values=running,pending" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          echo "Associating EIP with $INSTANCE_ID"
          aws ec2 associate-address \
            --instance-id "$INSTANCE_ID" \
            --allocation-id "${{ secrets.EC2_EIP_ALLOCATION_ID }}" \
            --allow-reassociation || echo "EIP already associated"

  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    needs: provision

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_EIP_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          envs: POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,SECRET_KEY,NEXT_PUBLIC_API_URL
          script: |
            cloud-init status --wait 2>/dev/null || true

            if [ ! -d /app/flightdesk/.git ]; then
              git clone \
                https://oauth2:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git \
                /app/flightdesk
            fi

            cd /app/flightdesk
            git fetch origin
            git checkout dev
            git reset --hard origin/dev

            cat > .env <<EOF
            POSTGRES_DB=${POSTGRES_DB}
            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            SECRET_KEY=${SECRET_KEY}
            ALGORITHM=HS256
            ACCESS_TOKEN_EXPIRE_MINUTES=1440
            NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
            EOF

            docker compose up -d --build
            docker system prune -f
            echo "Deploy complete: $(date)"
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
